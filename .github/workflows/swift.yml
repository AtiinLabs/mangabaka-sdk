name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v

    - name: Check generated client
      run: |
        Scripts/generate.sh
        git diff --exit-code -- Sources/MangaBakaSDK/Generated
        test -z "$(git status --porcelain -- Sources/MangaBakaSDK/Generated)"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
      with:
        args: --strict
